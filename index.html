<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Index</title>
<style>
  :root{--ink:#122a3f;--ink2:#41586e;--ink3:#78899a;--line:#e3eaf1;--accent:#0d6d5b;--soft:#e8f4f1}
  *{box-sizing:border-box}
  body{margin:0;background:#f2f6f9;color:var(--ink);font-size:14.5px;line-height:1.62;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
  header{background:linear-gradient(155deg,#0c2436,#123c4d 55%,#0d5a52);color:#fff;padding:28px 0 30px}
  header .k{font-size:10.5px;letter-spacing:1.5px;color:#9fd8c9;font-weight:700;margin-bottom:8px}
  header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px}
  header p{margin:7px 0 0;color:#c3d9d5;font-size:12.5px}
  h2{font-size:10.5px;letter-spacing:1.4px;color:var(--ink3);text-transform:uppercase;margin:26px 0 11px;font-weight:700}
  .item{display:flex;gap:13px;align-items:center;background:#fff;border:1px solid var(--line);
    border-radius:13px;padding:14px 15px;text-decoration:none;color:inherit;margin-bottom:10px;
    transition:border-color .15s,box-shadow .15s,transform .12s}
  .item:active{transform:scale(.99)}
  .item:hover{border-color:#bcd9d0;box-shadow:0 3px 12px rgba(13,109,91,.10)}
  .ico{flex:0 0 40px;height:40px;border-radius:11px;background:var(--soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:.2px}
  .txt{flex:1;min-width:0}
  .txt .t{font-size:14px;font-weight:600;line-height:1.4;word-break:break-word}
  .txt .d{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.5}
  .arrow{flex:0 0 auto;color:#b6c6d3;font-size:18px}
  footer{margin-top:24px;padding-top:15px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3);line-height:1.65}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="k">DOCUMENT INDEX</div>
    <h1>Product Compliance Documents</h1>
    <p>Scan the QR code to open the compliance page of each product</p>
  </div>
</header>
<div class="wrap">
  <h2>All documents</h2>
  <div id="list"></div>
  <footer>
    Maintained by the QR document publishing flow. New documents are appended as new sub-directories; existing documents are never overwritten.
  </footer>
</div>
<script>
var DOCS = [
  {
    dir: "r2412-4s2p-lnyd/",
    code: "R2412",
    title: "R2412-4S2P-LNYD — Battery Information & EU Declaration of Conformity",
    desc: "Rechargeable Lithium-ion Battery Pack · 14.4V / 69.12Wh · 25 pages, 23 languages"
  }
];
var list = document.getElementById('list');
DOCS.slice().reverse().forEach(function(d){
  var a = document.createElement('a');
  a.className = 'item';
  a.href = d.dir;
  a.innerHTML = '<span class="ico">' + d.code + '</span>' +
    '<span class="txt"><span class="t">' + d.title + '</span><span class="d">' + d.desc + '</span></span>' +
    '<span class="arrow">›</span>';
  list.appendChild(a);
});
</script>
</body>
</html>
